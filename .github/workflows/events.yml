name: Watchdog

# Runs on its own schedule because a watch cannot report its own absence: if
# no check has happened for hours, this is what says so. Every two hours, so
# the alarm comes six to eight hours after the last check rather than up to
# twelve. Its output is discarded; the alerts are the output.

on:
  schedule:
    - cron: '41 */2 * * *'
  workflow_dispatch:

concurrency:
  group: autotrader-events
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -q -r requirements.txt

      # The secrets reach this step only, not the checkout or the install.
      - name: Look for silence
        env:
          WATCH_PASSPHRASE:    ${{ secrets.WATCH_PASSPHRASE }}
          WATCH_PASSPHRASE_PREVIOUS: ${{ secrets.WATCH_PASSPHRASE_PREVIOUS }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          NTFY_TOKEN:          ${{ secrets.NTFY_TOKEN }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          TWILIO_SID:          ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN:        ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM:         ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:           ${{ secrets.TWILIO_TO }}
        run: |
          set -e
          python -m autotrader vault pull
          if [ ! -f vault/meta.json ]; then echo "No vault yet."; exit 0; fi
          python -m autotrader vault open
          # It finishes with 0 whenever it ran, so anything else is a crash:
          # said once the vault is saved, since a watchdog that fails quietly
          # is no watchdog. What it printed stays private.
          python -m autotrader --no-colour events --notify > /dev/null 2>&1 || failed=1
          python -m autotrader vault seal
          # Refused if a check saved in the meantime; the check's copy is newer.
          python -m autotrader vault push --lease || echo "a check saved first; nothing to add"
          if [ -n "${failed:-}" ]; then
            echo "::error::The watchdog could not look for silence. Open the vault locally and run 'python -m autotrader events' to see why."
            exit 1
          fi
