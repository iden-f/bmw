name: Publish dashboard

# Rebuilds and publishes the dashboard when the page itself changes. A check
# publishes on its own; this is for changes to the code. The site is built
# from the vault and carries only ciphertext; see autotrader/vault.py.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'autotrader/dashboard.py'
      - 'autotrader/vault.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -q -r requirements.txt

      # Not given WATCH_PASSPHRASE_PREVIOUS: this copy of the vault is never
      # saved, so re-encrypting it here would publish a page under a key, and
      # an ntfy topic, that the next check replaces. A check changes the
      # passphrase, and publishes the page once it has.
      - name: Build and publish
        env:
          WATCH_PASSPHRASE: ${{ secrets.WATCH_PASSPHRASE }}
        run: |
          set -e
          if [ -z "$WATCH_PASSPHRASE" ]; then
            echo "::error::Add a repository secret named WATCH_PASSPHRASE (12 or more characters). See the README."
            exit 1
          fi
          python -m autotrader vault pull
          if [ ! -f vault/meta.json ]; then
            echo "Nothing to publish until the first check has run."
            exit 0
          fi
          if ! python -m autotrader vault open; then
            echo "::notice::WATCH_PASSPHRASE does not open the vault yet. If the passphrase is changing, the next check re-encrypts it and publishes the page."
            exit 0
          fi
          python -m autotrader --no-colour dashboard > /dev/null 2>&1
          python -m autotrader vault site site
          python -m autotrader vault publish site
