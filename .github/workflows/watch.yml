name: Check AutoTrader

# The watch itself. This repository is public, and so is every Actions log:
# nothing here prints a search, a car or a topic. The bot's own output goes
# to run.log, which is sealed into the vault with the rest of its data.

on:
  schedule:
    # Every five minutes, because GitHub drops scheduled runs, often in
    # clusters, and this repository is public, so Actions minutes bill
    # nothing. The bot stands down unless a check is due (see
    # CHECK_INTERVAL_MINUTES below).
    - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
  # A change sent from the dashboard lands as a file in control/.
  push:
    branches: [main]
    paths: ['control/**']
  # The Marketplace collector sends what it read, sealed (collector/).
  # `check` is taken from an outside timer that still asks this way.
  repository_dispatch:
    types: [check, marketplace]
  # By hand, or by an outside timer (scripts/keep-time.sh) through the same
  # button's API. Starting a workflow needs a token that can only start one;
  # repository_dispatch needs one that can also change the code it runs.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would happen without sending or saving anything'
        type: boolean
        default: false
      automatic:
        description: 'Treat this as a scheduled check (stand down if one ran recently)'
        type: boolean
        default: false
      from:
        description: 'The name of the outside timer asking. Leave it empty.'
        type: string
        default: ''

concurrency:
  group: autotrader-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    # Anyone can see this repository; only its owner can drive it.
    if: github.event_name != 'push' || github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The runner label, for the cost figures; tests keep it in step with
      # runs-on above.
      REPO_RUNNER: ubuntu-latest
    steps:
      # The branch as it is now, not the commit the event fired on. A run
      # queued behind another would otherwise check out change files that
      # the other run already read and tidied away.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}

      # Written by the bot when this month's runner minutes are projected to
      # run out. Delete the file to resume.
      - name: Stop if this month's budget is spent
        id: guard
        run: |
          if [ -f BUDGET-STOP ]; then
            echo "::warning::BUDGET-STOP is present - not checking. Delete it to resume."
            echo "stop=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v6
        if: ${{ !steps.guard.outputs.stop }}
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        if: ${{ !steps.guard.outputs.stop }}
        run: pip install -q -r requirements.txt

      - name: Open the vault
        if: ${{ !steps.guard.outputs.stop }}
        env:
          WATCH_PASSPHRASE: ${{ secrets.WATCH_PASSPHRASE }}
          # Only while changing the passphrase: the old one, so the vault can
          # be re-encrypted under the new. Delete it after one check.
          WATCH_PASSPHRASE_PREVIOUS: ${{ secrets.WATCH_PASSPHRASE_PREVIOUS }}
        run: |
          if [ -z "$WATCH_PASSPHRASE" ]; then
            echo "::error::Add a repository secret named WATCH_PASSPHRASE (12 or more characters). See the README."
            exit 1
          fi
          python -m autotrader vault pull
          python -m autotrader vault open

      # The cadence the schedule above keeps, written into the vault's
      # config so the bot's stand-down floor, coverage tile and watchdog
      # agree with it. Set as repository variables to change them without a
      # commit; the fallbacks are this repository's own: a check every 15
      # minutes by day and every hour from 23:00 to 08:00 Pacific
      # (health.overnight, which only ever slows the watch down).
      - name: Keep the check interval in step with the schedule
        if: ${{ !steps.guard.outputs.stop }}
        env:
          INTERVAL:       ${{ vars.CHECK_INTERVAL_MINUTES || '15' }}
          FLOOR:          ${{ vars.CHECK_FLOOR_MINUTES || '11' }}
          NIGHT_START:    ${{ vars.CHECK_NIGHT_START || '23:00' }}
          NIGHT_END:      ${{ vars.CHECK_NIGHT_END || '08:00' }}
          NIGHT_INTERVAL: ${{ vars.CHECK_NIGHT_INTERVAL_MINUTES || '60' }}
        run: |
          python -m autotrader --no-colour set health.expected_interval_minutes "$INTERVAL" > /dev/null 2>&1
          python -m autotrader --no-colour set health.min_interval_minutes "$FLOOR" > /dev/null 2>&1
          python -m autotrader --no-colour set health.overnight.start "$NIGHT_START" > /dev/null 2>&1
          python -m autotrader --no-colour set health.overnight.end "$NIGHT_END" > /dev/null 2>&1
          python -m autotrader --no-colour set health.overnight.interval_minutes "$NIGHT_INTERVAL" > /dev/null 2>&1

      - name: Check
        id: bot
        if: ${{ !steps.guard.outputs.stop }}
        # A failed search still saves what the others found; the job is
        # failed at the end instead.
        continue-on-error: true
        env:
          WATCH_PASSPHRASE:    ${{ secrets.WATCH_PASSPHRASE }}
          # A Marketplace batch too big for its dispatch is read back as a
          # blob of this repository, with the workflow's own token.
          GH_TOKEN:            ${{ github.token }}
          REPO_VISIBILITY:     ${{ github.event.repository.visibility }}
          RUN_TRIGGER:         ${{ github.event_name }}
          DISPATCH_TYPE:       ${{ github.event.action }}
          DRY_RUN:             ${{ inputs.dry_run }}
          AUTOTRADER_SCHEDULED: ${{ (github.event_name == 'schedule'
            || github.event_name == 'repository_dispatch'
            || inputs.automatic || inputs.from) && '1' || '' }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}
          NTFY_TOKEN:          ${{ secrets.NTFY_TOKEN }}
          GMAIL_USER:          ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD:  ${{ secrets.GMAIL_APP_PASSWORD }}
          TWILIO_SID:          ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN:        ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM:         ${{ secrets.TWILIO_FROM }}
          TWILIO_TO:           ${{ secrets.TWILIO_TO }}
        run: |
          set +e
          # Whatever a caller sent arrives through the environment or the
          # event file, never pasted into this script.
          if [ "$DRY_RUN" = true ]; then dry=--dry-run; else dry=; fi
          {
            python -m autotrader --no-colour setup --non-interactive
            if [ -d control ]; then python -m autotrader --no-colour control control; fi
            if [ "$RUN_TRIGGER" = repository_dispatch ] && [ "$DISPATCH_TYPE" = marketplace ]; then
              python -m autotrader --no-colour marketplace ingest
              echo "$?" > "$RUNNER_TEMP/ingest"
            fi
            python -m autotrader --no-colour run $dry
            echo "$?" > "$RUNNER_TEMP/status"
            if [ -z "$dry" ]; then
              python -m autotrader --no-colour events --notify
              # The first check after Monday 14:00 UTC sends the week, so a
              # dropped firing delays it rather than losing it.
              python -m autotrader --no-colour weekly --notify --if-due
            fi
          } > run.log 2>&1
          status=$(cat "$RUNNER_TEMP/status")
          if [ "$status" = 0 ] && [ -f "$RUNNER_TEMP/ingest" ]; then
            status=$(cat "$RUNNER_TEMP/ingest")
          fi
          echo "check finished (exit $status)"
          exit "$status"

      - name: Save
        id: save
        if: ${{ !steps.guard.outputs.stop && !inputs.dry_run }}
        env:
          WATCH_PASSPHRASE: ${{ secrets.WATCH_PASSPHRASE }}
        run: |
          set -eu
          python -m autotrader vault seal
          python -m autotrader vault push
          # main carries no data: the bot's data files are untracked, and
          # applied change files are removed.
          git config user.name  "autotrader-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r -q --cached --ignore-unmatch -- $(python -m autotrader vault paths)
          git rm -r -q --ignore-unmatch -- control
          if [ -e BUDGET-STOP ] || [ -n "$(git ls-files -- BUDGET-STOP)" ]; then
            git add -A -- BUDGET-STOP
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Tidy up after a check [skip ci]"
          # The check restamps docs/sw.js when the page changed without it,
          # and a pull refuses a changed tracked file. Set aside, not
          # stashed: a stash meeting a newer sw.js from main leaves conflict
          # markers in it. `vault site` stamps it from what the pull brought.
          if [ -n "$(git ls-files -- docs/sw.js)" ]; then
            git checkout -q -- docs/sw.js
          fi
          for attempt in 1 2 3 4 5; do
            git rebase --abort 2>/dev/null || true
            if git pull -q --rebase origin "$GITHUB_REF_NAME" && \
               git push -q origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 4))
          done
          echo "::error::could not push to $GITHUB_REF_NAME"
          exit 1

      # Every publish also costs a "pages build and deployment" run, billed
      # like any other job, which is nothing on a public repository. A
      # changed page waits until the last publish is PAGE_MIN_GAP_MINUTES
      # old (0 here: publish every time it changed; a private copy should
      # raise it), and the page is published regardless once it is
      # PAGE_MAX_AGE_MINUTES old, so a change held back is never lost. A
      # hand-started check always publishes.
      - name: Decide whether to publish
        id: when
        if: ${{ !steps.guard.outputs.stop && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGED: ${{ steps.save.outputs.page }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && !inputs.automatic && !inputs.from }}
          MIN_GAP: ${{ vars.PAGE_MIN_GAP_MINUTES || '0' }}
          MAX_AGE: ${{ vars.PAGE_MAX_AGE_MINUTES || '360' }}
        run: |
          last=$(gh api "repos/$GITHUB_REPOSITORY/commits/gh-pages" --jq .commit.committer.date 2>/dev/null || true)
          if [ -n "$last" ]; then
            age=$(( ($(date +%s) - $(date -d "$last" +%s)) / 60 ))
          else
            age=999999
          fi
          if [ "$MANUAL" = true ] && [ -n "$CHANGED" ]; then
            echo "publish=1" >> "$GITHUB_OUTPUT"
          elif [ -n "$CHANGED" ] && [ "$age" -ge "$MIN_GAP" ]; then
            echo "publish=1" >> "$GITHUB_OUTPUT"
          elif [ "$age" -ge "$MAX_AGE" ]; then
            echo "publish=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Dashboard publish held (last one ${age} min ago, changed='${CHANGED}')."
          fi

      - name: Publish the dashboard
        if: ${{ steps.when.outputs.publish }}
        env:
          WATCH_PASSPHRASE: ${{ secrets.WATCH_PASSPHRASE }}
        run: |
          python -m autotrader vault site site
          python -m autotrader vault publish site

      - name: Report failure
        if: steps.bot.outcome == 'failure'
        run: |
          echo "::error::The check reported a problem. Results were still saved; the dashboard's Status tab says what."
          exit 1
