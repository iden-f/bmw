<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AutoTrader Watch</title>
<meta name="description" content="What changed on the cars you are watching, and whether the thing watching them is working.">
<meta name="theme-color" content="#f2f2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0e10" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Watch">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- The page holds a decryption key once unlocked, so nothing but its own
     script may run, and data may only be fetched from its own origin. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<style>
/* ------------------------------------------------------------------ tokens
   Every colour, radius, duration and spacing step the page uses is named
   here; the components below invent none of their own. */
:root {
  color-scheme: light dark;

  --bg:#f2f2ef; --surface:#ffffff; --surface-2:#e8e8e4; --surface-3:#dededa;
  --line:rgba(18,19,22,.11); --line-strong:rgba(18,19,22,.20);
  --text:#17181a; --text-2:#585d64; --text-3:#636870;
  --ev-new:#1160c4; --ev-drop:#0f6f43; --ev-rise:#8a5207; --ev-gone:#6b6f76;
  --ev-back:#5f37ab; --ev-priced:#0a6870;
  --warn:#845400; --warn-bg:#fdf6e6; --bad:#ab241d; --bad-bg:#fdeceb;
  --good:#0f6f43;
  --focus:#1160c4;

  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;

  --t-display:30px; --t-figure:21px; --t-h1:19px; --t-h2:15px;
  --t-body:14px; --t-small:13px; --t-micro:11px;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px;
  --s7:32px; --s8:40px; --s9:52px; --s10:64px;

  --r-sm:4px; --r-md:8px;

  /* One reading measure for anything that is sentences rather than figures.
     --measure-wide is for blocks that carry a table or a chart. */
  --measure:68ch; --measure-wide:820px;
  --shadow-overlay:0 1px 2px rgba(0,0,0,.06), 0 12px 32px -8px rgba(0,0,0,.22);

  --m-state:110ms; --m-enter:180ms; --m-number:220ms;
  --ease:cubic-bezier(.2,0,0,1);

  --gutter:var(--s4);
  --tabbar:calc(56px + env(safe-area-inset-bottom,0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0d0e10; --surface:#16181b; --surface-2:#1c1f23; --surface-3:#23262b;
    --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.19);
    --text:#e9eaec; --text-2:#a4a9b2; --text-3:#8b9099;
    --ev-new:#71aef8; --ev-drop:#4cc98d; --ev-rise:#e3a94e; --ev-gone:#8b9099;
    --ev-back:#b394f2; --ev-priced:#4ec6cf;
    --warn:#e3b45e; --warn-bg:#2a2313; --bad:#f4867e; --bad-bg:#2e1615;
    --good:#4cc98d;
    --focus:#71aef8;
    --shadow-overlay:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -8px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] {
  --bg:#0d0e10; --surface:#16181b; --surface-2:#1c1f23; --surface-3:#23262b;
  --line:rgba(255,255,255,.10); --line-strong:rgba(255,255,255,.19);
  --text:#e9eaec; --text-2:#a4a9b2; --text-3:#8b9099;
  --ev-new:#71aef8; --ev-drop:#4cc98d; --ev-rise:#e3a94e; --ev-gone:#8b9099;
  --ev-back:#b394f2; --ev-priced:#4ec6cf;
  --warn:#e3b45e; --warn-bg:#2a2313; --bad:#f4867e; --bad-bg:#2e1615;
  --good:#4cc98d;
  --focus:#71aef8;
  --shadow-overlay:0 1px 2px rgba(0,0,0,.5), 0 12px 32px -8px rgba(0,0,0,.7);
}
@media (min-width:700px){ :root{ --gutter:var(--s6); } }
@media (min-width:1100px){ :root{ --gutter:var(--s7); } }

*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); color:var(--text);
  font:400 var(--t-body)/1.45 var(--font);
  -webkit-font-smoothing:antialiased;
  padding-bottom:var(--tabbar);
}
@media (min-width:700px){ body{ padding-bottom:0; } }
img{ max-width:100%; display:block; }
button,input,select,textarea{ font:inherit; color:inherit; }
a{ color:var(--ev-new); text-underline-offset:2px; }
[hidden]{ display:none !important; }

/* Figures. Tabular everywhere - a column of prices that shifts as digits
   change is a column you cannot scan. */
.num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1; }
.mono{ font-family:var(--font-mono); font-size:.92em; }

:focus-visible{ outline:2px solid var(--focus); outline-offset:2px; border-radius:2px; }
:focus:not(:focus-visible){ outline:none; }
.skip{
  position:absolute; left:var(--s3); top:-100px; z-index:60;
  background:var(--surface); color:var(--text); padding:var(--s2) var(--s3);
  border:1px solid var(--line-strong); border-radius:var(--r-sm);
  transition:top var(--m-state) var(--ease);
}
.skip:focus{ top:var(--s3); }
.sr{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

/* ------------------------------------------------------------------ chrome */
.wrap{ max-width:1180px; margin:0 auto; padding-inline:var(--gutter); }
/* Lists of sentences rather than grids stay narrow: a price far from its car
   reads as a second column, not as part of the row. */
.measure{ max-width:var(--measure-wide); }
/* Prose gets the prose measure whatever element it is in, so an intro and
   the callout under it run to the same line length. */
.why, p.note, .state p{ max-width:var(--measure); }

.topbar{
  position:sticky; top:0; z-index:30; background:var(--bg);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);
}
.topbar__in{ display:flex; align-items:center; gap:var(--s3); height:52px; flex-wrap:nowrap; }
.brand{ display:flex; align-items:baseline; gap:var(--s2); margin-right:auto; flex:none; }
.brand b{ font-size:var(--t-h2); font-weight:620; letter-spacing:-.01em; }
.brand span{
  font-size:var(--t-micro); font-weight:520; letter-spacing:.06em;
  text-transform:uppercase; color:var(--text-3);
}
@media (max-width:459px){ .brand span{ display:none; } }

/* The trust line. Always present, because "is this current" is the first
   question and it should never need a click. */
.trust{
  display:flex; align-items:center; gap:var(--s2); min-width:0;
  font-size:var(--t-small); color:var(--text-2); white-space:nowrap;
  overflow:hidden;
}
.trust > span:not(.trust__dot){ overflow:hidden; text-overflow:ellipsis; }
.trust__dot{
  width:7px; height:7px; border-radius:50%; background:var(--good);
  flex:none;
}
.trust[data-state="stale"] .trust__dot{ background:var(--warn); }
.trust[data-state="bad"] .trust__dot{ background:var(--bad); }
.trust b{ font-weight:520; color:var(--text); }
@media (max-width:699px){ .trust__cov{ display:none; } }

/* A failing bot should make the page look wrong on purpose. */
.alarm{
  background:var(--warn-bg); color:var(--text); font-size:var(--t-small);
  border-left:2px solid var(--warn); border-radius:0 var(--r-sm) var(--r-sm) 0;
  margin-top:var(--s5);
}
.alarm[data-level="bad"]{ border-left-color:var(--bad); }
.alarm[data-level="bad"]{ background:var(--bad-bg); }
.alarm__in{ display:flex; gap:var(--s3); align-items:flex-start; padding:var(--s3); }
.alarm__mark{ font-weight:560; color:var(--warn); flex:none; }
.alarm[data-level="bad"] .alarm__mark{ color:var(--bad); }
.alarm p{ margin:0; }
.alarm p + p{ margin-top:var(--s1); color:var(--text-2); }
.alarm code{ font-family:var(--font-mono); font-size:.92em; word-break:break-word; }

/* Tabs: a bottom bar on a phone (thumb), a row under the header above it. */
.tabs{ background:var(--bg); }
.tabs__in{ display:flex; gap:var(--s1); }
.tab{
  appearance:none; background:none; border:0; cursor:pointer;
  display:flex; align-items:center; gap:var(--s2);
  padding:var(--s3) 0; margin-right:var(--s5);
  font-size:var(--t-small); font-weight:520; color:var(--text-2);
  border-bottom:2px solid transparent; border-radius:0;
  transition:color var(--m-state) var(--ease), border-color var(--m-state) var(--ease);
}
.tab[aria-current="page"]{ color:var(--text); border-bottom-color:var(--text); }
.tab__n{
  font-size:var(--t-micro); font-variant-numeric:tabular-nums;
  color:var(--text-3); background:var(--surface-2);
  padding:1px var(--s1); border-radius:var(--r-sm);
}
.tab[aria-current="page"] .tab__n{ color:var(--text-2); }
.tab__n[data-unread="1"]{
  background:var(--ev-new); color:var(--bg); font-weight:560;
}
.tab__n:empty{ display:none; }

@media (max-width:699px){
  .tabs{
    position:fixed; left:0; right:0; bottom:0; z-index:30;
    border-top:1px solid var(--line);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  .tabs__in{ justify-content:space-around; }
  .tab{
    flex:1; flex-direction:column; gap:3px; margin:0; padding:var(--s2) var(--s1);
    height:54px; justify-content:center; border-bottom:0;
    border-top:2px solid transparent; font-size:var(--t-micro);
  }
  /* The badge is the same box whether or not it holds a number, so the
     labels line up across the bar. */
  .tab__n{
    min-width:22px; height:17px; line-height:15px; text-align:center;
    display:inline-block; padding:0 var(--s1);
  }
  /* An empty badge keeps its slot: the tabs are equal cells, and a missing
     box would lift some of the labels. */
  .tab__n:empty{ display:inline-block; background:none; }
  .tab[aria-current="page"]{ border-top-color:var(--text); border-bottom-color:transparent; }
}
@media (min-width:700px){ .tabs{ border-bottom:1px solid var(--line); } }

/* ------------------------------------------------------------------ views */
.view{ padding-block:var(--s6) var(--s9); }
.view[hidden]{ display:none !important; }
.view__head{ margin-bottom:var(--s5); }
.view__head h1{
  margin:0; font-size:var(--t-h1); font-weight:560; letter-spacing:-.01em;
}
.view__head p{
  margin:var(--s2) 0 0; color:var(--text-2); font-size:var(--t-small);
  max-width:var(--measure);
}
@media (prefers-reduced-motion:no-preference){
  .view:not([hidden]){ animation:rise var(--m-enter) var(--ease) both; }
}
@keyframes rise{ from{ opacity:0; transform:translateY(4px);} to{ opacity:1; transform:none; } }

.section{ margin-top:var(--s7); }
.section.measure{ max-width:820px; }
.section:first-child{ margin-top:0; }
.section__head{
  display:flex; align-items:baseline; gap:var(--s3);
  padding-bottom:var(--s2); margin-bottom:var(--s3);
  border-bottom:1px solid var(--line);
}
.section__head h2{
  margin:0; font-size:var(--t-micro); font-weight:520; letter-spacing:.06em;
  text-transform:uppercase; color:var(--text-2);
}
/* A search name is shown as written; uppercased, it would read as a label. */
.section__head h2.name{
  font-size:var(--t-h2); font-weight:560; letter-spacing:-.01em;
  text-transform:none; color:var(--text);
}
.section__head .count{
  font-size:var(--t-micro); color:var(--text-3);
  font-variant-numeric:tabular-nums; margin-left:auto;
}

/* ------------------------------------------------------------------ feed */
.feed{ list-style:none; margin:0; padding:0; }
.ev{
  display:grid; grid-template-columns:auto auto 1fr auto; gap:0 var(--s3);
  align-items:baseline;
  padding:var(--s3) var(--s3) var(--s3) var(--s4);
  border-left:2px solid var(--line);
  background:none; border-top:0; border-right:0; border-bottom:0;
  width:100%; text-align:left; cursor:pointer; font:inherit; color:inherit;
  border-radius:0 var(--r-sm) var(--r-sm) 0;
  transition:background var(--m-state) var(--ease);
}
.ev:hover{ background:var(--surface-2); }
.ev + .ev{ border-top:1px solid var(--line); }
.ev[data-kind="new"]{ border-left-color:var(--ev-new); }
.ev[data-kind="price_drop"]{ border-left-color:var(--ev-drop); }
.ev[data-kind="price_rise"]{ border-left-color:var(--ev-rise); }
.ev[data-kind="removed"]{ border-left-color:var(--ev-gone); }
.ev[data-kind="relisted"]{ border-left-color:var(--ev-back); }
.ev[data-kind="priced"]{ border-left-color:var(--ev-priced); }

/* The photograph, spanning both rows at the left. A fixed box, filled or
   empty: the picture arriving must not move the line under it. */
.ev__shot{
  /* Required: .shot__fallback is absolutely positioned with inset:0, and
     without a positioned parent it covers the page. */
  position:relative;
  grid-column:1; grid-row:1/3; align-self:center;
  width:56px; height:42px; flex:none; overflow:hidden;
  border-radius:var(--r-sm); background:var(--surface-2);
}
.ev__shot img{ width:100%; height:100%; object-fit:cover; display:block; }
.ev__shot .shot__fallback{
  width:100%; height:100%; display:flex; align-items:center;
  justify-content:center; color:var(--text-3);
}
/* The words under the glyph do not fit in 56px and are already on the row. */
.ev__shot .shot__fallback span{ display:none; }
.ev__shot .shot__fallback svg{ width:20px; height:20px; }
.ev__when{
  grid-column:2; grid-row:1; font-size:var(--t-micro); color:var(--text-3);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.ev__title{
  grid-column:3; grid-row:1; font-size:var(--t-h2); font-weight:520;
  color:var(--text);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.ev__fig{
  grid-column:4; grid-row:1; font-size:var(--t-h2); font-weight:560;
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.ev__sub{
  grid-column:3/-1; grid-row:2; margin-top:var(--s1);
  font-size:var(--t-small); color:var(--text-2);
  display:flex; flex-wrap:wrap; gap:0 var(--s2);
}
.ev__was{ text-decoration:line-through; color:var(--text-3); }
.ev--unread .ev__title::after{
  content:""; display:inline-block; width:6px; height:6px; margin-left:var(--s2);
  border-radius:50%; background:var(--ev-new); vertical-align:middle;
}
.drop{ color:var(--ev-drop); }
.rise{ color:var(--ev-rise); }
/* On a phone the row stacks: the time on its own line above the car, the
   figure beside the car, the detail underneath. The photograph keeps the
   left column and spans all three lines. */
@media (max-width:559px){
  .ev{ grid-template-columns:auto 1fr auto; }
  .ev__shot{ grid-column:1; grid-row:1/4; }
  .ev__when{ grid-column:2/-1; grid-row:1; margin-bottom:var(--s1); }
  .ev__title{ grid-row:2; grid-column:2; }
  .ev__fig{ grid-row:2; grid-column:3; }
  .ev__sub{ grid-row:3; grid-column:2/-1; }
}

/* A label over each block, so two stacked blocks of numbers do not read as
   one table. */
.subhead{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:0 var(--s2);
  margin:var(--s5) 0 var(--s2);
}
.subhead h3{
  margin:0; font-size:var(--t-micro); font-weight:520; letter-spacing:.06em;
  text-transform:uppercase; color:var(--text-2);
}
.subhead span{ font-size:var(--t-small); color:var(--text-3); }

/* The bounds on every figure above, in the one place a person is deciding
   whether to believe one. */
.limits{ list-style:none; margin:0; padding:0; }
.limits li{
  font-size:var(--t-small); color:var(--text-2); line-height:1.55;
  padding:var(--s3) 0 var(--s3) var(--s4);
  border-left:2px solid var(--line);
}
.limits li + li{ border-top:1px solid var(--line); }

/* Said only where there is a keyboard to say it about. */
.only-keyboard kbd{
  font:inherit; background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--r-sm); padding:1px var(--s2);
}
@media (max-width:699px){ .only-keyboard{ display:none; } }

/* The shortcut list. A panel rather than a modal: it explains four keys and
   does not deserve to take the screen away from you. */
.shortcuts{
  position:fixed; right:var(--s4); bottom:var(--s4); z-index:40;
  max-width:min(340px, calc(100vw - var(--s6)));
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-md); box-shadow:var(--shadow-overlay);
  padding:var(--s4); font-size:var(--t-small);
}
.shortcuts dl{
  display:grid; grid-template-columns:auto 1fr; gap:var(--s2) var(--s3);
  margin:0 0 var(--s3);
}
.shortcuts dt, .shortcuts dd{ margin:0; }
.shortcuts dd{ color:var(--text-2); }
.shortcuts kbd{
  font:inherit; font-variant-numeric:tabular-nums; white-space:nowrap;
  background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--r-sm); padding:1px var(--s2); color:var(--text);
}
/* It is a keyboard affordance, so it stays out of the way where there is no
   keyboard. Nothing is lost: every one of the four has a visible control. */
@media (max-width:699px){ .shortcuts{ display:none; } }

.marker{
  display:flex; align-items:center; gap:var(--s3); margin:var(--s5) 0;
  font-size:var(--t-micro); font-weight:520; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ev-new);
}
.marker::before,.marker::after{
  content:""; height:1px; background:var(--ev-new); opacity:.35; flex:1;
}

/* ------------------------------------------------------------------ cards */
.grid{
  display:grid; gap:var(--s4);
  grid-template-columns:repeat(auto-fill,minmax(232px,1fr));
}
@media (max-width:559px){ .grid{ grid-template-columns:1fr; gap:var(--s2); } }
/* The line under a sorted run, above the cars the sort could not read. It
   spans the whole grid or it looks like a card with no picture. */
.grid__split{
  grid-column:1/-1; margin:var(--s2) 0 0;
  display:flex; align-items:center; gap:var(--s3);
  font-size:var(--t-micro); font-weight:520; letter-spacing:.04em;
  text-transform:uppercase; color:var(--text-3);
}
.grid__split::after{
  content:""; height:1px; background:var(--line); flex:1;
}

.card{
  display:flex; flex-direction:column; text-align:left;
  background:var(--surface); border:0; border-radius:var(--r-md);
  padding:0; overflow:hidden; cursor:pointer; font:inherit; color:inherit;
  outline-offset:2px;
  transition:background var(--m-state) var(--ease);
}
.card:hover{ background:var(--surface-2); }
.card__shot{
  position:relative; aspect-ratio:4/3; background:var(--surface-2);
  overflow:hidden;
}
.card__shot img{
  width:100%; height:100%; object-fit:cover; display:block;
  background:var(--surface-2);
}
/* A photo that fails to load says what the car is instead of leaving an
   empty box. The fallback is absolutely positioned, so every container that
   holds one must be position:relative, or it covers the page. */
.card__shot, .ev__shot{ position:relative; }
.shot__fallback{
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:var(--s2);
  background:var(--surface-3); color:var(--text-2); text-align:center;
  padding:var(--s3);
}
.shot__fallback svg{ opacity:.5; }
.shot__fallback span{
  font-size:var(--t-micro); letter-spacing:.06em; text-transform:uppercase;
}
.shot__fallback b{ font-size:var(--t-small); font-weight:520; color:var(--text-2); }
.card__body{ padding:var(--s3); display:flex; flex-direction:column; gap:var(--s2); flex:1; }
.card__title{
  font-size:var(--t-small); font-weight:400; color:var(--text-2);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; line-height:1.35; min-height:2.7em;
}
.card__price{
  display:flex; align-items:baseline; gap:var(--s2); flex-wrap:wrap;
}
.card__price b{
  font-size:var(--t-figure); font-weight:560; letter-spacing:-.015em;
  font-variant-numeric:tabular-nums;
}
.card__was{
  font-size:var(--t-small); color:var(--text-3); text-decoration:line-through;
  font-variant-numeric:tabular-nums;
}
.card__delta{ font-size:var(--t-small); font-weight:520; font-variant-numeric:tabular-nums; }
.facts{
  display:flex; flex-wrap:wrap; gap:0 var(--s3); font-size:var(--t-small);
  color:var(--text-2); font-variant-numeric:tabular-nums;
}
.facts u{ text-decoration:none; font-size:var(--t-micro); color:var(--text-3); }
.card__foot{
  margin-top:auto; padding-top:var(--s2); border-top:1px solid var(--line);
  display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap;
  font-size:var(--t-micro); color:var(--text-3);
}
.card--gone .card__shot img,.card--gone .card__title{ opacity:.5; }

    </div>
    <button class="iconbtn" id="lock-now" type="button" aria-label="Lock" title="Lock this device" hidden>
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2.5" y="6" width="9" height="7" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.5 6V4.2a2.5 2.5 0 015 0V6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
  </div>
</header>

<div class="clock" id="clock" data-state="off">
  <dl class="wrap clock__in">
    <div class="clock__cell">
      <dt>Last check</dt>
      <dd id="clock-last">&mdash;</dd>
    </div>
    <div class="clock__cell">
      <dt>How often</dt>
      <dd id="clock-every">&mdash;</dd>
    </div>
    <div class="clock__cell clock__cell--next">
      <dt>Next check</dt>
      <dd id="clock-next" aria-live="off">&mdash;</dd>
    </div>
  </dl>
  <div class="clock__rail" id="clock-rail" aria-hidden="true"><i id="clock-fill"></i></div>
</div>

<nav class="tabs" aria-label="Views">
  <div class="wrap tabs__in" id="tabs"></div>
</nav>

<main id="main" class="wrap" tabindex="-1" style="display:flow-root">
  <div class="alarm" id="alarm" role="status" hidden>
    <div class="alarm__in">
      <span class="alarm__mark" id="alarm-mark" aria-hidden="true">!</span>
      <div><p id="alarm-text"></p><p id="alarm-detail"></p></div>
    </div>
  </div>
  <form class="lock" id="lock" hidden>
    <h1>Locked</h1>
    <p>Enter the passphrase to open this dashboard.</p>
    <input type="text" name="username" autocomplete="username" value="dashboard"
           tabindex="-1" aria-hidden="true" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
    <label class="field" for="lock-pass">
      <input id="lock-pass" type="password" autocomplete="current-password"
             aria-label="Passphrase" placeholder="Passphrase" required>
    </label>
    <label class="lock__keep"><input id="lock-keep" type="checkbox" checked> Keep this device unlocked</label>
    <button class="btn btn--primary" id="lock-go" type="submit">Unlock</button>
    <p class="lock__msg" id="lock-msg" role="alert"></p>
  </form>
  <section class="view" data-view="feed" aria-labelledby="feed-h" hidden></section>
  <section class="view" data-view="listings" aria-labelledby="listings-h" hidden></section>
  <section class="view" data-view="market" aria-labelledby="market-h" hidden></section>
  <section class="view" data-view="searches" aria-labelledby="searches-h" hidden></section>
  <section class="view" data-view="status" aria-labelledby="status-h" hidden></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="sheet__grab" aria-hidden="true"></div>
  <div class="sheet__bar">
    <h2 id="sheet-title">Listing</h2>
    <button class="iconbtn" id="sheet-close" aria-label="Close">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
    </button>
  </div>
  <div class="sheet__body" id="sheet-body"></div>
</aside>

<script src="app.js" defer></script>
</body>
</html>
